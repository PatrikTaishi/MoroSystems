name: Full Test Pipeline

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api-tests:
    name: API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run API tests
        run: npx playwright test --project=api --reporter=html

      - name: Upload API report
        uses: actions/upload-artifact@v3
        with:
          name: api-report
          path: playwright-report

  ui-tests:
    name: UI Tests
    runs-on: ubuntu-latest
    needs: api-tests   

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run UI tests
        run: npx playwright test --project=chromium --reporter=html

      - name: Upload UI report
        uses: actions/upload-artifact@v3
        with:
          name: ui-report
          path: playwright-report